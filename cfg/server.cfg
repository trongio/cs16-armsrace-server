hostname "CS 1.6 Arms Race"
sv_password "set-by-install"
rcon_password "set-by-install"
sv_lan 0

// Network
sv_maxrate 100000
sv_minrate 20000
sv_maxupdaterate 101
sv_minupdaterate 30
sys_ticrate 1000
sv_cheats 0

// FastDL for custom maps
sv_allowdownload 1
sv_allowupload 1
sv_downloadurl "http://YOUR_PUBLIC_IP:27080/"

log on
sv_logecho 1
mp_logdetail 3

// Mode settings live in st/<mode>.cfg (run by servertools.amxx on every map)
